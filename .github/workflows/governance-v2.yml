name: governance-v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: governance.validate
    runs-on: windows-latest
    env:
      GOVERNANCE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - shell: powershell
        run: python -m governance.engine validate --repository .
      - shell: powershell
        if: github.event_name == 'pull_request'
        run: .\scripts\Generate-GovernanceEvidence.ps1 -GateId governance.validate -OutputDirectory evidence
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: governance-evidence-governance
          path: evidence/*.json
          if-no-files-found: error

  powershell-51:
    name: governance.ps51
    runs-on: windows-latest
    env:
      GOVERNANCE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - shell: powershell
        run: .\scripts\Invoke-GovernanceV2.ps1 -Mode Validate
      - shell: powershell
        if: github.event_name == 'pull_request'
        run: .\scripts\Generate-GovernanceEvidence.ps1 -GateId governance.ps51 -OutputDirectory evidence
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: governance-evidence-powershell-51
          path: evidence/*.json
          if-no-files-found: error

  powershell-7:
    name: governance.ps7
    runs-on: windows-latest
    env:
      GOVERNANCE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - shell: pwsh
        run: .\scripts\Invoke-GovernanceV2.ps1 -Mode Validate
      - shell: pwsh
        if: github.event_name == 'pull_request'
        run: .\scripts\Generate-GovernanceEvidence.ps1 -GateId governance.ps7 -OutputDirectory evidence
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: governance-evidence-powershell-7
          path: evidence/*.json
          if-no-files-found: error

  offline-tests:
    name: tests.offline
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GOVERNANCE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject fork pull requests before private dependency access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: pwsh
        run: throw "tests.offline requires private commerce-api-core access; fork pull requests cannot receive that access."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Create read-only commerce-api-core token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: commerce-api-core-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.COMMERCE_API_CORE_APP_ID }}
          private-key: ${{ secrets.COMMERCE_API_CORE_APP_PRIVATE_KEY }}
          owner: hagiwara777
          repositories: commerce-api-core
          permission-contents: read
      - name: Checkout pinned commerce-api-core
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: hagiwara777/commerce-api-core
          ref: 31dd33fe4afa9bf4da1208c2886b62d899744658
          path: .ci/commerce-api-core
          token: ${{ steps.commerce-api-core-token.outputs.token }}
          persist-credentials: false
      - name: Install pinned commerce-api-core
        run: python -m pip install ./.ci/commerce-api-core
      - run: python -m pytest -q
      - shell: powershell
        if: github.event_name == 'pull_request'
        run: .\scripts\Generate-GovernanceEvidence.ps1 -GateId tests.offline -OutputDirectory evidence
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: governance-evidence-offline-tests
          path: evidence/*.json
          if-no-files-found: error

  protected-capabilities:
    name: protected.ph + protected.sg
    runs-on: windows-latest
    env:
      GOVERNANCE_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_governance_v2.py tests/test_guardrails.py tests/test_prelisting_gate.py tests/test_sls_category_protected.py -q
      - shell: powershell
        if: github.event_name == 'pull_request'
        run: |
          .\scripts\Generate-GovernanceEvidence.ps1 -GateId protected.ph -OutputDirectory evidence
          .\scripts\Generate-GovernanceEvidence.ps1 -GateId protected.sg -OutputDirectory evidence
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && success()
        with:
          name: governance-evidence-protected-capabilities
          path: evidence/*.json
          if-no-files-found: error
